[package]
name = "netd"
description = "The network stack: takes the machine's network interface, gets it an IPv4 address by DHCP, answers ARP and ping."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# How the service manager runs it (init documents the fields).
[package.metadata.silica.service]
needs = ["silica.device.Manager"]
memory = 23
start = "boot"
restart = "always"

[[bin]]
name = "netd"
path = "src/main.rs"
test = false
bench = false

[dependencies]
silica-rt = { workspace = true }
silica-idl-rt = { workspace = true }
silica-protocols = { workspace = true }
silica-net = { workspace = true }
silica-queue = { workspace = true }
silica-inet = { workspace = true }

[lints]
workspace = true
