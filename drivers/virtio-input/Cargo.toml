[package]
name = "virtio-input"
description = "The virtio input device driver: a keyboard, as silica.input.Device."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# What the device manager starts this driver for (silica_driver documents the forms).
[package.metadata.silica]
drivers = ["pci 1af4:1052"]

[[bin]]
name = "virtio-input"
path = "src/main.rs"
test = false
bench = false

[dependencies]
silica-rt = { workspace = true }
silica-driver = { workspace = true }
silica-idl-rt = { workspace = true }
silica-protocols = { workspace = true }

[lints]
workspace = true
