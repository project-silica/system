[package]
name = "virtio-console"
description = "The virtio console driver: a byte stream to the host, as silica.console.Port."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# What the device manager starts this driver for (silica_driver documents the forms).
[package.metadata.silica]
drivers = ["pci 1af4:1043"]

[[bin]]
name = "virtio-console"
path = "src/main.rs"
test = false
bench = false

[dependencies]
silica-rt = { workspace = true }
silica-driver = { workspace = true }
silica-idl-rt = { workspace = true }
silica-protocols = { workspace = true }

[lints]
workspace = true
