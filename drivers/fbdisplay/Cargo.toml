[package]
name = "fbdisplay"
description = "The display driver for a framebuffer the firmware set up: silica.display.Framebuffer."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# What the device manager starts this driver for: the firmware's display,
# any VGA-compatible controller (silica_driver documents the forms).
[package.metadata.silica]
drivers = ["class 03.00.00"]
# It draws in its device's framebuffer and never asks it to read memory:
# its device is left without bus mastering (no DMA to confine).
dma = false

[[bin]]
name = "fbdisplay"
path = "src/main.rs"
test = false
bench = false

[dependencies]
silica-rt = { workspace = true }
silica-driver = { workspace = true }
silica-idl-rt = { workspace = true }
silica-protocols = { workspace = true }

[lints]
workspace = true
