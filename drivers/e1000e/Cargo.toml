[package]
name = "e1000e"
description = "The Intel 82574 (e1000e) network driver: one interface as a silica.net.Device."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# What the device manager starts this driver for (silica_driver documents the forms).
[package.metadata.silica]
drivers = ["pci 8086:10d3"]

[lib]
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name = "e1000e"
path = "src/main.rs"
test = false
bench = false

[dependencies]
silica-rt = { workspace = true }
silica-driver = { workspace = true }
silica-net = { workspace = true }

[lints]
workspace = true
