[package]
name = "silica-driver-fuzz"
description = "Coverage-guided fuzz targets for the driver framework: what a device writes and the driver reads (run by tools/fuzz.sh)."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
silica-driver = { path = ".." }
silica-rt = { path = "../../../rt" }

[[bin]]
name = "virtqueue"
path = "fuzz_targets/virtqueue.rs"
test = false
doc = false
bench = false

[[bin]]
name = "virtio_transport"
path = "fuzz_targets/virtio_transport.rs"
test = false
doc = false
bench = false

# Not part of the system workspace: cargo-fuzz builds it on its own.
[workspace]

[profile.release]
debug = 1
