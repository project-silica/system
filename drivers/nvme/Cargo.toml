[package]
name = "nvme"
description = "The NVMe controller driver: one namespace as a silica.block.Device."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# What the device manager starts this driver for (silica_driver documents the forms).
[package.metadata.silica]
drivers = ["class 01.08.02"]

[lib]
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name = "nvme"
path = "src/main.rs"
test = false
bench = false

[dependencies]
silica-rt = { workspace = true }
silica-driver = { workspace = true }
silica-block = { workspace = true }

# Built only into test images (os/tools/lib/build.sh): what commits a device's
# faults on purpose (silica_driver::inject). A machine's image has none of it.
[features]
harness = ["silica-driver/harness"]

[lints]
workspace = true
