[package]
name = "virtio-rng"
description = "The virtio entropy device driver: random bits from the host, as silica.entropy.Device."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# What the device manager starts this driver for (silica_driver documents the forms).
[package.metadata.silica]
drivers = ["pci 1af4:1044"]

[[bin]]
name = "virtio-rng"
path = "src/main.rs"
test = false
bench = false

[dependencies]
silica-rt = { workspace = true }
silica-driver = { workspace = true }
silica-idl-rt = { workspace = true }
silica-protocols = { workspace = true }

[lints]
workspace = true
