[package]
name = "init"
description = "The root task: takes what the kernel hands over and starts the system from the ramdisk."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "init"
path = "src/main.rs"
test = false
bench = false

[features]
# A test image's init: it obeys `checks=`, `bench` and `halt=reboot` on the
# command line, runs the check programs and turns the machine off with a
# status for the harness. No image a machine runs is built with it.
harness = []

[dependencies]
silica-protocols = { workspace = true }
silica-manifest = { workspace = true }
silica-idl-rt = { workspace = true }
libsys = { workspace = true }
silica-formats = { workspace = true }
silica-crypto = { workspace = true }
silica-rt = { workspace = true }
silica-proc = { workspace = true }

[lints]
workspace = true
