[workspace]
resolver = "3"
members = ["rt", "proc", "init", "hello", "echo-server", "echo-client", "trial-server", "trial-client", "stress", "systest"]
# The libraries also build on the host, for clippy; the programs need the Silica target.
default-members = ["rt", "proc"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("silica"))'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# The kernel's interface crates and the IDL runtime and compiler come from
# the checkouts beside this one: the workshop layout is the build layout (spec/REPOSITORIES.md).
[workspace.dependencies]
libsys = { path = "../kernel/libsys" }
silica-formats = { path = "../kernel/formats" }
silica-idl-rt = { path = "../idl/rt" }
silica-idlc = { path = "../idl/idlc" }
silica-rt = { path = "rt" }
silica-proc = { path = "proc" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
debug = "line-tables-only"
