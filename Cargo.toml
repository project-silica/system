[workspace]
resolver = "3"
members = [
    "rt",
    "proc",
    "init",
    "hello",
    "echo-server",
    "echo-client",
    "trial-server",
    "trial-client",
    "stress",
    "systest",
    "queue",
    "protocols",
    "storage/block",
    "storage/partitions",
    "net",
    "inet",
    "crypto",
    "remote/proto",
    "devmgr",
    "blkcheck",
    "blkload",
    "svcload",
    "netcheck",
    "netd",
    "netload",
    "netfault",
    "tcphog",
    "partcheck",
    "logd",
    "httpd",
    "remote",
    "entropy",
    "entropycheck",
    "drivers/framework",
    "drivers/virtio-blk",
    "drivers/virtio-net",
    "drivers/e1000e",
    "drivers/virtio-rogue",
    "drivers/nvme",
    "drivers/virtio-input",
    "drivers/virtio-rng",
    "drivers/watchdog-esb",
    "drivers/virtio-console",
    "drivers/fbdisplay",
    "console",
    "console/grid",
    "shell",
]
# The libraries also build on the host, for clippy; the programs need the Silica target.
default-members = ["rt", "proc", "queue", "protocols", "storage/block", "net", "inet", "crypto", "remote/proto", "drivers/framework", "console/grid"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("silica"))'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# The kernel's interface crates and the IDL runtime and compiler come from
# the checkouts beside this one: the workshop layout is the build layout (spec/REPOSITORIES.md).
[workspace.dependencies]
libsys = { path = "../kernel/libsys" }
silica-formats = { path = "../kernel/formats" }
silica-idl-rt = { path = "../idl/rt" }
silica-idlc = { path = "../idl/idlc" }
silica-rt = { path = "rt" }
silica-proc = { path = "proc" }
silica-driver = { path = "drivers/framework" }
silica-queue = { path = "queue" }
silica-net = { path = "net" }
silica-inet = { path = "inet" }
silica-crypto = { path = "crypto" }
silica-remote = { path = "remote/proto" }
silica-protocols = { path = "protocols" }
silica-block = { path = "storage/block" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
debug = "line-tables-only"
# Arithmetic that overflows stops the program (it restarts) instead of
# wrapping into a wrong length, time or offset: checked as the kernel is.
overflow-checks = true
