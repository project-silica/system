[package]
name = "devmgr"
description = "The device manager: finds the machine's devices, starts a driver for each with only that device's capabilities, and restarts it when it fails."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# How the service manager runs it (init documents the fields).
[package.metadata.silica.service]
provides = "silica.device.Manager"
needs = ["silica.system.Manager:logs+power"]
machine = true
memory = 26
start = "boot"
restart = "always"
ends = true

[lib]
path = "src/lib.rs"
test = true
bench = false

[[bin]]
name = "devmgr"
path = "src/main.rs"
test = false
bench = false

[dependencies]
libsys = { workspace = true }
silica-rt = { workspace = true }
silica-proc = { workspace = true }
silica-formats = { workspace = true }
silica-driver = { workspace = true }
silica-idl-rt = { workspace = true }
silica-protocols = { workspace = true }


# Built only into test images (os/tools/lib/build.sh): what commits a device's
# faults on purpose (silica_driver::inject). A machine's image has none of it.
[features]
harness = ["silica-driver/harness"]

[lints]
workspace = true
