[package]
name = "blkload"
description = "Writes to a scratch disk under load while its driver is killed, and measures each recovery."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# How the service manager runs it (init documents the fields).
[package.metadata.silica.service]
needs = ["silica.device.Manager"]
memory = 23
start = "check:load"

[[bin]]
name = "blkload"
path = "src/main.rs"
test = false
bench = false

[dependencies]
silica-rt = { workspace = true }
silica-block = { workspace = true }
silica-protocols = { workspace = true }

[lints]
workspace = true
