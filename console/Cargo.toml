[package]
name = "console"
description = "The local console: text on the screen and the serial line, lines from the keyboard, as silica.console.Terminal."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# How the service manager runs it (init documents the fields).
[package.metadata.silica.service]
provides = "silica.console.Terminal"
needs = ["silica.device.Manager:input+display+port"]
memory = 23
start = "boot"
restart = "always"

[[bin]]
name = "console"
path = "src/main.rs"
test = false
bench = false

[dependencies]
silica-rt = { workspace = true }
silica-formats = { workspace = true }
silica-ring = { workspace = true }
silica-idl-rt = { workspace = true }
silica-protocols = { workspace = true }

[lints]
workspace = true
