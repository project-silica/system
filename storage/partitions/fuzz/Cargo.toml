[package]
name = "partitions-fuzz"
description = "Coverage-guided fuzz targets for the GPT as the partitions service reads it from a disk (run by tools/fuzz.sh)."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
partitions = { path = ".." }

[[bin]]
name = "gpt"
path = "fuzz_targets/gpt.rs"
test = false
doc = false
bench = false

# Not part of the system workspace: cargo-fuzz builds it on its own.
[workspace]

[profile.release]
debug = 1
