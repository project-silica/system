[package]
name = "svcload"
description = "Restarts each restartable service under its clients' load and measures each recovery."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# How the service manager runs it (init documents the fields).
[package.metadata.silica.service]
needs = ["silica.system.Manager:observe+control+logs", "silica.block.Partitions:list+open", "silica.log.Reader", "silica.console.Terminal", "silica.device.Manager:block+network+display+port+input+entropy+control"]
controls = ["partitions", "devmgr", "logd", "console", "shell"]
memory = 22
start = "check:services"
# The logs its flood asks for (LOGS in src/main.rs): given all of them, and
# refused the next.
logs = 36
# On a processor after the first (the service manager chooses): what it
# loads is the services on processor 0.
cpu = "any"

[[bin]]
name = "svcload"
path = "src/main.rs"
test = false
bench = false

[dependencies]
silica-rt = { workspace = true }
silica-idl-rt = { workspace = true }
silica-block = { workspace = true }
silica-protocols = { workspace = true }

[lints]
workspace = true
