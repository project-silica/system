[package]
name = "logd"
description = "The log service: every service's text, kept and put on the console (silica.log.Log)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# How the service manager runs it (init documents the fields). The service
# manager gives it every other service's log ring and starts it first.
[package.metadata.silica.service]
provides = "silica.log.Reader"
needs = ["silica.system.Manager"]
memory = 22
start = "boot"
restart = "always"

[[bin]]
name = "logd"
path = "src/main.rs"
test = false
bench = false

[dependencies]
silica-rt = { workspace = true }
silica-idl-rt = { workspace = true }
silica-protocols = { workspace = true }

[lints]
workspace = true
