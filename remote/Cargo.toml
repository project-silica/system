[package]
name = "remote"
description = "The remote management service: an owner on another machine inspects, steers and updates this one over an authenticated, encrypted session."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# How the service manager runs it (init documents the fields). It needs the
# network stack, the service manager and the log, in that order (channels 1
# and 2 of a session are the last two), is given its owners from the boot
# archive, as provisioned for this machine, and a key of its own that lasts
# across boots (`key`: made on the machine from its secret, on no disk): the
# machine's key. Without either it says so and ends: remote management is
# off.
[package.metadata.silica.service]
needs = ["silica.net.Tcp:listen=22", "silica.system.Manager:observe+control+update+power", "silica.log.Reader"]
# What its owners' control and update reach: an update hands on what its
# target holds, so netd (the stack, updated in place by its owners) is named;
# remote itself is not: updating it is holding its key and every scope, which
# no owner is given until each has a capability of its own (S4).
controls = ["*", "netd"]
files = ["remote.owners"]
key = true
keeps = true
memory = 23
start = "boot"
restart = "always"
secrets = true

[[bin]]
name = "remote"
path = "src/main.rs"
test = false
bench = false

[dependencies]
silica-rt = { workspace = true }
silica-net = { workspace = true }
silica-protocols = { workspace = true }
silica-idl-rt = { workspace = true }
silica-remote = { workspace = true }
silica-crypto = { workspace = true }

[lints]
workspace = true
