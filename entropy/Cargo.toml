[package]
name = "entropy"
description = "The entropy service: random bytes nobody can predict, from the boot's entropy and every randomness device (silica.entropy.Source)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# How the service manager runs it (init documents the fields).
[package.metadata.silica.service]
provides = "silica.entropy.Source"
needs = ["silica.device.Manager:entropy"]
memory = 22
start = "boot"
restart = "always"
seed = true
secrets = true

[lib]
path = "src/lib.rs"
bench = false

[[bin]]
name = "entropy"
path = "src/main.rs"
test = false
bench = false

[dependencies]
silica-rt = { workspace = true }
silica-idl-rt = { workspace = true }
silica-formats = { workspace = true }
silica-protocols = { workspace = true }

[lints]
workspace = true
