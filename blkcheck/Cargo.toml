[package]
name = "blkcheck"
description = "Checks and measures the block path from a client: the device manager, a block driver, its device, and back."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# How the service manager runs it (init documents the fields).
[package.metadata.silica.service]
needs = ["silica.device.Manager:block+input+port+display"]
memory = 24
start = "check:block"

[[bin]]
name = "blkcheck"
path = "src/main.rs"
test = false
bench = false

[dependencies]
silica-rt = { workspace = true }
silica-idl-rt = { workspace = true }
silica-protocols = { workspace = true }
silica-block = { workspace = true }
silica-queue = { workspace = true }


[lints]
workspace = true
